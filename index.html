<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate Drop Collective | Claim Slip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 p-10" x-data="slipLookup()" x-cloak>

    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg" x-show="!orderData">
        <h1 class="font-black uppercase mb-4">Verify Order</h1>
        <input type="text" x-model="refInput" placeholder="Enter Ref No." class="w-full p-3 border rounded mb-3">
        <button @click="lookupOrder" class="w-full bg-black text-white py-3 rounded">Verify Status</button>
        <p x-text="errorMsg" class="text-red-500 text-xs mt-2"></p>
    </div>

    <div class="max-w-2xl mx-auto" x-show="orderData">
        <div class="mb-4 p-4 rounded text-center font-bold uppercase" 
             :class="orderData.status === 'paid' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'">
            Status: <span x-text="orderData.status"></span>
        </div>

        <div id="receipt-canvas" class="bg-white p-10 border shadow-md">
            <h2 class="text-2xl font-black">Crate Drop Collective</h2>
            <p><strong>Customer:</strong> <span x-text="orderData?.fbName"></span></p>
            <p><strong>Ref:</strong> <span x-text="orderData?.refNum"></span></p>
            
            <div class="mt-6 border-t pt-4">
                <template x-for="item in cartItems" :key="item.name">
                    <div class="flex justify-between py-1">
                        <span x-text="item.quantity + 'x ' + item.name"></span>
                        <span>₱<span x-text="(item.fullPrice * item.quantity).toLocaleString()"></span></span>
                    </div>
                </template>
            </div>
            
            <div class="mt-6 font-black text-right">
                <p>Total DP Paid: ₱<span x-text="orderData?.totalDP?.toLocaleString()"></span></p>
                <p>Remaining: ₱<span x-text="orderData?.totalBalance?.toLocaleString()"></span></p>
            </div>
        </div>
    </div>

    <script>
        function slipLookup() {
            return {
                refInput: '', orderData: null, errorMsg: '', cartItems: [],
                gasWebAppUrl: 'https://script.google.com/macros/s/AKfycbyVawSFuTLq1j_Xmtf5jN_vDNxl-TtoE_xVnTDx_puRV68bcFVky-brGwoaeOrLEzON_g/exec',

                async lookupOrder() {
                    const res = await fetch(`${this.gasWebAppUrl}?ref=${this.refInput.trim().toUpperCase()}`);
                    const data = await res.json();

                    if (data.found) {
                        // Normalize status to lowercase for comparison
                        data.status = data.status ? data.status.toString().trim().toLowerCase() : 'pending';
                        
                        this.orderData = data;
                        try {
                            this.cartItems = JSON.parse(data.cartData);
                        } catch(e) { console.error("JSON Error"); }
                    } else {
                        this.errorMsg = "Not found.";
                    }
                }
            }
        }
    </script>
</body>
</html>
